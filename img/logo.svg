<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="Baltis">
  <title>Baltis</title>
  <!-- Mark: saulė virš Galvės, pilies bokštas, laivo korpusas, trys bangos -->
  <g transform="translate(10,10)">
    <circle cx="60" cy="42" r="34" fill="#C9A46A"/>
    <!-- pilies bokštas -->
    <path d="M44 76 V36 h4 v-6 h4 v6 h4 v-6 h4 v6 h4 v-6 h4 v6 h4 v40 Z" fill="#0B2E3F"/>
    <!-- laivo korpusas -->
    <path d="M14 84 H106 L96 100 H26 Z" fill="#0B2E3F"/>
    <!-- bangos -->
    <path d="M8 110 c10 -8 20 -8 30 0 s20 8 30 0 s20 -8 30 0" fill="none" stroke="#0B2E3F" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 120 c10 -8 20 -8 30 0 s20 8 30 0" fill="none" stroke="#0B2E3F" stroke-width="4" stroke-linecap="round" opacity=".55"/>
  </g>
  <!-- Wordmark -->
  <text x="150" y="82" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-weight="600" font-size="78" letter-spacing="10" fill="#0B2E3F">BALTIS</text>
  <text x="153" y="112" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="17" letter-spacing="6" fill="#0B2E3F" opacity=".75">TRAKAI IŠ VANDENS</text>
</svg>
